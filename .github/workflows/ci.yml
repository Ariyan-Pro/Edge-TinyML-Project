name: Edge-TinyML CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-suite:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install minimal dependencies (low-disk optimized)
      run: |
        python -m venv venv
        . venv/bin/activate
        pip install --upgrade pip
        # Core deps only (~20MB): NumPy backend works without TensorFlow
        pip install numpy scipy soundfile pytest prometheus_client sounddevice
        # Optional: Try lightweight librosa install (skip if disk full)
        pip install librosa --no-deps || echo "librosa skipped (disk space)"
    - name: Run safety tests
      run: |
        . venv/bin/activate
        pytest tests/security/automated_safety_test.py -v
    - name: Verify wake word detector loads
      run: |
        . venv/bin/activate
        python -c "import sys; sys.path.insert(0, '.'); from wake_word_detector import WakeWordDetector; print('✅ WakeWordDetector loaded successfully')"
